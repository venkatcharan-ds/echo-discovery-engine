[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-discovery-engine"
version = "0.1.0"
description = "Evidence-conscious discovery of potentially overlooked GitHub projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
echo-discover = "echo_discovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
